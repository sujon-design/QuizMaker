<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCQ Quiz Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--n:#12305a;--t1:#00b2a9;--t2:#0088d1;--bg:#eeeff5;--cd:#fff;--tx:#12305a;--mu:#6b7794;--c1:#ff6b8b;--c2:#ff9a8b;--ok:#16a34a;--er:#e11d48;--bd:#2a4a7a}
[data-th=dark]{--bg:#0f1426;--cd:#1b2240;--tx:#e8ebff;--mu:#9aa3c7;--bd:#4a5a96}
[data-th=rose]{--bg:#fff1f4;--t1:#ff6b8b;--t2:#ff9a5c}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.55 'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#hd{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 14px;color:#fff;font-size:1.2rem;background:linear-gradient(180deg,#4a7090,#0b1f3d);box-shadow:0 3px 14px rgba(0,0,0,.25)}
#hd.t{background:linear-gradient(90deg,var(--t1),var(--t2))}
#ht{flex:1;text-align:center}#mb{background:none;border:0;color:#fff;font-size:1.7rem;cursor:pointer;width:36px}
#sd{position:fixed;top:0;left:0;bottom:0;width:270px;z-index:40;transform:translateX(-100%);transition:.3s;overflow-y:auto;background:#f5f7fc;color:#12305a;box-shadow:6px 0 24px rgba(0,0,0,.25)}
#sd.open{transform:none}#sd.t{background:linear-gradient(160deg,var(--t1),var(--t2));color:#fff}
.lg{text-align:center;padding:22px 10px 14px;border-bottom:1px solid rgba(127,127,127,.3)}
.lg i{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:#fff;font-size:2.4rem;font-style:normal;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.ins,.tn{font-weight:600;font-size:1.1rem}
#nv{padding:10px 0}#nv a{display:flex;gap:14px;align-items:center;padding:13px 22px;color:inherit;text-decoration:none;font-size:1.05rem}
#nv a i{font-style:normal;width:26px;text-align:center}#nv a:hover,#nv a.on{background:rgba(127,127,127,.2)}
#bk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
@media(min-width:900px){#sd{transform:none;box-shadow:none;border-right:1px solid rgba(127,127,127,.3)}#mb,#bk{display:none!important}#hd,#mn{margin-left:270px}}
.tk #sd,.tk #mb{display:none}.tk #hd,.tk #mn{margin-left:0}
.pg{max-width:780px;margin:0 auto;padding:16px}
.ttl{margin:4px auto 18px;padding:12px;text-align:center;font-size:1.5rem;font-weight:500;color:#fff;border-radius:8px;background:linear-gradient(90deg,var(--t2),var(--t1));box-shadow:0 8px 20px rgba(0,136,209,.3)}
.bt{display:inline-block;border:0;border-radius:8px;padding:12px 28px;font:500 1.1rem 'Hind Siliguri',sans-serif;color:#fff;cursor:pointer;text-decoration:none;text-align:center;background:linear-gradient(90deg,var(--t1),var(--t2));box-shadow:0 6px 16px rgba(0,136,209,.35);transition:.2s}
.bt:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,136,209,.45)}
.ob{display:inline-block;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit;text-decoration:none;margin:3px}
.ob:disabled{opacity:.4}.ob.g{background:#00b400;color:#fff;border-color:#00b400}.ob.r{color:var(--er);border-color:var(--er)}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;border-radius:6px;outline:none}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(0,136,209,.25)}
input[type=checkbox]{width:28px;height:28px;flex:none}
label.f{display:block;margin:14px 0 4px;font-size:1.05rem}
.ac{text-align:center;margin:12px 0 22px}.fm{display:grid;gap:14px;max-width:420px;margin:20px auto;text-align:center}
.mu{color:var(--mu)}.er{color:var(--er);text-align:center;font-weight:500;margin:14px 0}.ok{color:var(--ok)}
.tc{display:flex;margin:0 0 16px;border-radius:16px;overflow:hidden;background:linear-gradient(90deg,var(--c1),var(--c2) 70%);box-shadow:0 8px 20px rgba(255,107,139,.3);min-height:84px;color:#12305a}
.tc b{width:50px;display:grid;place-items:center;background:rgba(0,0,0,.12);border-right:1.5px solid #12305a;font-weight:400;font-size:1.2rem}
.tc a{flex:1;padding:12px 16px;display:flex;align-items:center;color:#12305a;text-decoration:none;font-size:1.2rem}
.tc button{width:54px;border:0;border-left:1.5px solid #12305a;background:rgba(255,255,255,.25);font-size:1.6rem;cursor:pointer;color:#12305a}
.li{display:flex;align-items:center;gap:6px;background:var(--cd);padding:10px 14px;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.li span{flex:1}
.kv{width:100%;border-collapse:collapse;margin:8px 0 14px}.kv td,.rt td,.rt th{padding:10px;border:1px solid var(--bd);background:var(--cd)}.rt{width:100%;border-collapse:collapse}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.tabs button{padding:11px 2px;border:1.5px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font:500 .95rem 'Hind Siliguri',sans-serif;cursor:pointer;transition:.15s}
.tabs button:hover{border-color:var(--t2)}.tabs button:active{background:rgba(0,136,209,.15)}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}.row2 .ob{flex:1;min-width:100px;padding:16px 8px}
.tbw{position:sticky;top:54px;z-index:20;background:var(--bg);padding:6px 0 4px;margin:4px 0 8px}
.tb{display:flex;gap:6px;margin:0 0 6px}.tb button{flex:1;min-height:40px;padding:6px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer;font:inherit;font-size:1.05rem;border-radius:10px;transition:.12s}
.tb button:hover{border-color:var(--t2)}.tb button:active{background:linear-gradient(90deg,var(--t1),var(--t2));color:#fff}
.tb.m{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch}.tb.m button{flex:none;min-width:42px;padding:6px 10px}
.tb.m .sp{flex:none;width:1px;background:var(--bd);margin:4px 2px}
.tbl{font-size:.82rem;color:var(--mu)}.tbl b{color:var(--t2)}
.pvw{margin:0 0 10px;padding:8px 12px;border-radius:10px;border:1.5px dashed var(--t2);background:var(--cd)}.pvw:empty{display:none}
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em;line-height:1.25}
.mf>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}.mf>span:last-child{padding:0 4px}
.mr{white-space:nowrap}.mr>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}.mr sup{font-size:.6em}
.tb .mf{font-size:.7rem;margin:0}
.orow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.qr{display:flex;background:var(--cd);border:1px solid var(--bd);margin-bottom:12px;border-radius:10px;overflow:hidden}.qr>div:first-child{flex:1;padding:14px}
.qr p{margin:6px 0}.ra{font-weight:600}.qa{display:flex;flex-direction:column;width:56px;border-left:1px solid var(--bd)}.qa button{flex:1;border:0;background:none;font-size:1.3rem;cursor:pointer}
.sc{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;padding:10px 14px;border-radius:10px;font-weight:600;background:linear-gradient(90deg,rgba(0,178,169,.2),rgba(0,136,209,.2))}
img{max-width:100%;border-radius:8px;margin:8px 0}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:14px 0}.st div{background:var(--cd);padding:12px;border-radius:12px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}.st b{display:block;font-size:1.5rem}
.sc2{text-align:center;font-size:3rem;font-weight:600;background:linear-gradient(90deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent}.sc2 small{font-size:1.2rem}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tm{font-weight:600;padding:5px 14px;border-radius:99px;background:var(--cd);border:1px solid var(--bd)}
.qc{background:var(--cd);padding:16px;border-radius:14px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}.qt{font-size:1.15rem;font-weight:500;margin-bottom:8px}
.op{display:flex;gap:12px;align-items:center;padding:12px 14px;margin:8px 0;border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;transition:.15s}.op:hover{border-color:var(--t2)}
.op span{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,136,209,.15);font-weight:600}
.op.sel{border-color:var(--t2);background:linear-gradient(90deg,rgba(0,178,169,.2),rgba(0,136,209,.2))}.op.ok{background:rgba(22,163,74,.2);border-color:var(--ok)}.op.bad{background:rgba(225,29,72,.18);border-color:var(--er)}
.ex{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(245,158,11,.15)}
.row{display:flex;gap:10px;justify-content:space-between;margin:14px 0}.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
.pal button{height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer;font:inherit}.pal .d{background:var(--ok);color:#fff}.pal .c{outline:2px solid var(--t2)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:16px;border-radius:20px 20px 0 0}.sh h3{margin-bottom:10px}.sh .ob{display:block;width:100%;text-align:left;margin:8px 0}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:20px}}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,90px);background:#111;color:#fff;padding:10px 20px;border-radius:12px;transition:.3s;z-index:90}#toast.on{transform:translate(-50%,0)}
pre{background:var(--cd);padding:10px;border-radius:8px;white-space:pre-wrap;font-size:.9rem;margin:8px 0}
@media print{#hd,#sd,#bk,.bt,.ob,.qa,.tabs{display:none!important}#hd,#mn{margin-left:0!important}body{background:#fff;color:#000}}
#svs{position:fixed;right:12px;bottom:12px;z-index:80;font-size:.85rem;background:var(--cd);border:1px solid var(--bd);padding:3px 12px;border-radius:99px;display:none;color:var(--tx)}
</style>
</head>
<body>
<aside id="sd"><div id="lg" class="lg"></div><nav id="nv" onclick="mo(0)"></nav></aside><div id="bk" onclick="mo(0)"></div>
<header id="hd"><button id="mb" onclick="mo(1)">☰</button><span id="ht"></span><span style="width:36px"></span></header>
<main id="mn"></main><div id="toast"></div><div id="svs"></div>
<script>
const D=document,$=s=>D.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RT=s=>E(s).replace(/&lt;(\/?)(b|i|u|sup|sub)&gt;/g,'<$1$2>')
 .replace(/&lt;f&gt;([\s\S]*?)\|([\s\S]*?)&lt;\/f&gt;/g,'<span class="mf"><span>$1</span><span>$2</span></span>')
 .replace(/&lt;r&gt;([\s\S]*?)&lt;\/r&gt;/g,'<span class="mr">√<span>$1</span></span>')
 .replace(/&lt;r3&gt;([\s\S]*?)&lt;\/r3&gt;/g,'<span class="mr"><sup>3</sup>√<span>$1</span></span>')
 .replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const bn2en=s=>String(s).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
const mk=(name,pw,cat,qs=[])=>({id:uid(),name,pw,cat,desc:'',time:10,mark:1,neg:0,showRes:1,tries:0,shuffle:0,display:'one',opt:'num',th:'',who:'any',info:0,status:'published',qs,nq:0});
const S=(q,o,a,e)=>({t:'mc',q,o,a:[a],e:e||''});
const API='https://script.google.com/macros/s/AKfycbwEUndKwUS2Gb-BYYt-G2wD8ayYj85Nw5zAaGHALCr8BE_ReLuSwq8Yw8iThgDdBxPX/exec';
let DB=null,BANK=[],TT=null,STUC=null,ST={m:''},SQ={},svT=0,busy=0,pend=0;
const DEV=(()=>{let d='';try{d=localStorage.getItem('qm_dev')||'';if(!d){d=uid();localStorage.setItem('qm_dev',d)}}catch(e){d=uid()}return d})();
async function api(a,d){if(/PASTE/.test(API)){toast('index.html-এ API লিংক বসানো হয়নি');throw new Error('noapi')}
 let r;try{const x=await fetch(API,{method:'POST',body:JSON.stringify({...d,a,tk:sessionStorage.getItem('qm_tk')||''})});r=await x.json()}catch(e){if(a!='sub'&&a!='saveMeta'&&a!='saveQs')toast('নেটওয়ার্ক সমস্যা — আবার চেষ্টা করুন');throw e}
 if(r&&r.auth){sessionStorage.removeItem('qm_tk');DB=null;const er=new Error('auth');er.auth=1;loginPg();toast('সেশন শেষ — আবার লগইন করুন');throw er}
 return r}
const metaStr=()=>JSON.stringify({inst:DB.inst,cf:DB.cf,cats:DB.cats,tests:DB.tests.map(t=>{const o={...t};if(t.qs)o.nq=cnt(t);delete o.qs;delete o.results;return o})});
const setSt=x=>{const e=$('#svs');if(!e)return;e.style.display=x?'block':'none';e.textContent=x};
function sv(){pend=1;clearTimeout(svT);svT=setTimeout(flush,600);setSt('⏳ সংরক্ষণ হচ্ছে…')}
async function flush(){if(!DB){pend=0;return}if(busy){svT=setTimeout(flush,400);return}busy=1;pend=0;
 try{const m=metaStr();if(m!==ST.m){const r=await api('saveMeta',{meta:JSON.parse(m)});if(r.err)throw 0;ST.m=m}
  for(const t of DB.tests){if(!t.qs)continue;const q=JSON.stringify(t.qs);if(SQ[t.id]!==q){const r=await api('saveQs',{id:t.id,qs:t.qs});if(r.err)throw 0;SQ[t.id]=q}}
  if(!pend){setSt('✔ সংরক্ষিত');setTimeout(()=>{if(!pend&&!busy)setSt('')},1500)}}
 catch(e){if(e&&e.auth){pend=0;setSt('')}else{pend=1;setSt('⚠️ সংরক্ষণ ব্যর্থ — আবার চেষ্টা হবে');svT=setTimeout(flush,5000)}}
 busy=0}
addEventListener('beforeunload',e=>{if(pend||busy){e.preventDefault();e.returnValue=''}});
async function ensureQs(t){if(t.qs)return;const r=await api('getQs',{id:t.id});let cur='';const q=r.qs||[];q.forEach(x=>{if(x.t=='sec'){x.id=x.id||uid();cur=x.id}else if(x.sid===undefined)x.sid=cur});t.qs=q;norm(t);SQ[t.id]=JSON.stringify(t.qs)}
async function init(){D.body.classList.add('tk');$('#hd').className='t';$('#ht').textContent='MCQ Quiz Maker';$('#mn').innerHTML='<div class="pg"><p class="mu" style="text-align:center;margin-top:40px">লোড হচ্ছে…</p></div>';
 let r;try{r=await api('boot')}catch(e){if(e&&e.auth)return;return $('#mn').innerHTML='<div class="pg"><p class="er">সার্ভারের সাথে সংযোগ হয়নি</p><div class="ac"><button class="bt" onclick="init()">আবার চেষ্টা করুন</button></div></div>'}
 if(!r||!r.meta)return;DB=r.meta;DB.user=r.user;DB.cf=DB.cf||'All';BANK=r.bank||[];SQ={};STUC=null;ST.m=metaStr();route()}
function norm(t){t.qs.forEach(x=>{if(x.t=='sec')x.id=x.id||uid()});const ids=new Set(t.qs.filter(x=>x.t=='sec').map(x=>x.id));
 t.qs.forEach(x=>{if(x.t!='sec'&&!ids.has(x.sid))x.sid=''});const out=t.qs.filter(x=>x.t!='sec'&&!x.sid);
 t.qs.filter(x=>x.t=='sec').forEach(sc=>{out.push(sc);t.qs.forEach(x=>{if(x.t!='sec'&&x.sid==sc.id)out.push(x)})});t.qs.splice(0,t.qs.length,...out)}
function migr(){DB.tests.forEach(t=>{let cur='';t.qs.forEach(x=>{if(x.t=='sec'){x.id=x.id||uid();cur=x.id}else if(x.sid===undefined)x.sid=cur});norm(t)})}
const secs=t=>t.qs.filter(q=>q.t=='sec');
const LIM=200,cnt=t=>t.qs?t.qs.filter(q=>q.t!='sec').length:(t.nq||0),room=t=>LIM-cnt(t);
function secSel(id,cur,tt){const S=secs(tt||CT);if(!S.length)return '';return `<label class="f">📂 এমসিকিউ প্রশ্নটি কোন সেকশনের আন্ডারে রাখতে চান?</label><select id="${id}" style="margin-bottom:10px"><option value="x" ${cur=='x'?'selected':''}>— সেকশন নির্বাচন করুন —</option><option value="" ${cur===''?'selected':''}>কোনো সেকশন নয়</option>${S.map(x=>`<option value="${x.id}" ${x.id==cur?'selected':''}>${E(x.q)}</option>`).join('')}</select>`}
function secVal(id){const e=$('#'+id);if(!e)return '';if(e.value=='x'){toast('কোন সেকশনের আন্ডারে রাখবেন তা নির্বাচন করুন');return null}return e.value}
let CT=null,DR=null,QT='mc',QI=null,QIMG='',R=null,TM=0,PV=[],TB='';
const tst=id=>DB.tests.find(t=>t.id===id);
const lnk=id=>location.href.split('#')[0]+'#/take/'+id;
function tlf(id){const e=$('#tlk');if(e)e.textContent=lnk(id)}
function tlc(id){cp(lnk(id))}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
const go=h=>{location.hash=h};
function cp(s){(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('Copied ✔')).catch(()=>prompt('Copy:',s))}
function mo(o){$('#sd').classList.toggle('open',!!o);$('#bk').style.display=o?'block':'none'}
function csv(name,rows){const s='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=D.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download=name+'.csv';a.click()}
function sheet(title,items){const o=D.createElement('div');o.className='ov';o.innerHTML=`<div class="sh"><h3>${title}</h3></div>`;const s=o.firstChild;
 if(typeof items=='string')s.insertAdjacentHTML('beforeend',items);else items.forEach(([l,f,c])=>{const b=D.createElement('button');b.className='ob '+(c||'');b.innerHTML=l;b.onclick=()=>{o.remove();f&&f()};s.appendChild(b)});
 const c=D.createElement('button');c.className='ob';c.textContent='Close';c.onclick=()=>o.remove();s.appendChild(c);o.onclick=e=>{if(e.target===o)o.remove()};D.body.appendChild(o)}
const ttl=x=>`<h1 class="ttl">${x}</h1>`;

/* ===== shell & routing ===== */
function shell(title,menu,t,body){
 $('#ht').textContent=title;$('#hd').className=t?'t':'';$('#sd').className=t?'t':'';
 const h=location.hash||'#/';
 $('#lg').innerHTML=t?`<div class="tn">${E(t.name)}</div>`:`<i>🎯</i><div class="ins">${E(DB.inst)} ✅</div>`;
 $('#nv').innerHTML=menu.map(m=>`<a href="${m[2]}" class="${h===m[2]||(t&&m[2].length>TB.length&&h.startsWith(m[2]))?'on':''}"><i>${m[0]}</i>${m[1]}</a>`).join('');
 $('#mn').innerHTML=`<div class="pg">${body}</div>`;mo(0);scrollTo(0,0)}
const IM=[['🏠','Institution','#/'],['👤','Profile','#/profile'],['🗂️','Category','#/cat'],['↕️','Reorder','#/reorder'],['✏️','Practice','#/practice'],['🎓','Students','#/students'],['🗃️','Question Bank','#/qbank'],['🛟','Support','#/support'],['🚪','Logout','#/logout']];
const inst=(title,body)=>{TB='';shell(title,IM,null,body)};
function route(){clearInterval(TM);D.body.classList.remove('tk');D.body.dataset.th='';
 const p=(location.hash.slice(2)||'').split('/'),v=p[0];
 if(v==='take'&&p[2]!=='p')return take(p[1],false);
 if(v==='logout'){sessionStorage.removeItem('qm_tk');DB=null;STUC=null;location.hash='#/';return}
 if(!authed())return loginPg();
 if(!DB)return init();
 if(v==='take')return take(p[1],true);

 const row=(x,pg)=>`<div class="li"><a href="#/qbank/${x.id}" style="flex:1;color:inherit;text-decoration:none"><b>${E(x.name)}</b><br><small class="mu">${x.tot} টি প্রশ্ন${x.ch?` · ${x.ch} টি অধ্যায়`:''}${!x.par&&x.cat?' · 🗂️ '+E(x.cat):''}</small></a><button class="ob" onclick="bRn('${x.id}','${pg}')">✏️</button><button class="ob r" onclick="bDS('${x.id}','${pg}')">🗑️</button></div>`;
 try{const all=await bSubs();all.forEach(x=>x.ch=all.filter(y=>y.par==x.id).length);
 if(!sid)return bs(ttl('Question Bank')+'<p class="mu" style="margin-bottom:12px">বিষয় ভিত্তিক প্রশ্ন সংরক্ষণ করুন। বিষয় তৈরির পর চাইলে অধ্যায় তৈরি করা যায়; অধ্যায় না করলে প্রশ্নগুলো বিষয়ের মূল অংশে থাকে।</p>'+
  (all.filter(x=>!x.par).map(x=>row(x,'')).join('')||'<p class="mu" style="text-align:center">কোনো বিষয় নেই। নিচে যোগ করুন।</p>')+
  `<div class="fm"><input id="bsn" placeholder="নতুন বিষয়ের নাম"><select id="bsc" style="margin:8px 0"><option value="">🗂️ ক্যাটাগরি: অশ্রেণিবদ্ধ</option>${DB.cats.map(c=>`<option>${E(c)}</option>`).join('')}</select><button class="bt" onclick="bAddS()">Add Subject</button></div>`);
 const sb=all.find(x=>x.id==sid);if(!sb)return go('#/qbank');
 const kids=all.filter(y=>y.par==sid),par=sb.par&&all.find(y=>y.id==sb.par);
 if(BQ.sid!=sid)BQ={sid,s:'',p:0};
 const off=BQ.p*50,{out,more}=await bPage(sid,off,50,BQ.s.toLowerCase());
 bs(ttl(E(sb.name))+`<div class="st"><div><b>${sb.tot}</b>Questions</div>${kids.length?`<div><b>${kids.length}</b>অধ্যায়</div>`:''}</div><div class="ac"><a class="ob" href="#/qbank${par?'/'+par.id:''}">← ${par?E(par.name):'বিষয়সমূহ'}</a>${sb.par?'':`<button class="ob" onclick="bCh('${sid}')">➕ অধ্যায় তৈরি করুন</button><button class="ob" onclick="bCat('${sid}')">🗂️ ক্যাটাগরি${sb.cat?': '+E(sb.cat):''}</button>`}<button class="ob" onclick="bTxt('${sid}')">📝 Text</button><button class="ob" onclick="bCsv('${sid}')">📄 CSV</button><button class="ob" onclick="bOne('${sid}')">➕ একটি প্রশ্ন</button><button class="ob g" onclick="bTest('${sid}')">📤 টেস্টে যোগ করুন</button></div>`+
  (kids.length?`<div class="sc"><span>📚 অধ্যায়সমূহ</span><span>${kids.length}</span></div>`+kids.map(c=>row(c,sid)).join('')+`<div class="sc"><span>📂 মূল প্রশ্ন (অধ্যায়বিহীন)</span><span>${sb.n}</span></div>`:'')+
  `<input id="bsq" placeholder="🔎 খুঁজে Enter চাপুন" value="${E(BQ.s)}" style="margin-bottom:14px" onkeydown="if(event.key=='Enter'){BQ.s=this.value;BQ.p=0;pBank('${sid}')}">`+
  (out.map((x,i)=>`<div class="qr"><div><b>${off+i+1}.</b> ${RT(x.q)}${x.o.map((o,j)=>`<p>${j+1}. ${RT(o)}</p>`).join('')}<p class="ra">Right Answer : ${x.a.map(y=>y+1).join(', ')}</p></div><div class="qa"><button onclick="bDQ('${sid}','${x.id}',${x.k})">🗑️</button></div></div>`).join('')||'<p class="mu" style="text-align:center">কোনো প্রশ্ন নেই।</p>')+
  `<div class="row"><button class="ob" ${BQ.p?'':'disabled'} onclick="BQ.p--;pBank('${sid}')">← Prev</button><span class="mu">পৃষ্ঠা ${BQ.p+1}</span><button class="ob" ${more?'':'disabled'} onclick="BQ.p++;pBank('${sid}')">Next →</button></div>`)
 }catch(e){bs('<p class="er">Question Bank খোলা যায়নি (সার্ভার সমস্যা)।</p>')}}
async function bAddS(){const n=$('#bsn').value.trim();if(!n)return toast('বিষয়ের নাম লিখুন');const id=await bNew(n,'',$('#bsc').value);await pBank();sheet('✅ বিষয় তৈরি হয়েছে — অধ্যায় তৈরি করবেন?',[['📚 অধ্যায় তৈরি করুন',()=>bCh(id)],['না, মূল হিসেবে থাকুক',()=>go('#/qbank/'+id)]])}
async function bCh(par){const n=(prompt('অধ্যায়ের নাম')||'').trim();if(!n)return location.hash=='#/qbank/'+par?pBank(par):go('#/qbank/'+par);await bNew(n,par);toast('অধ্যায় তৈরি হয়েছে ✔');
 if(confirm('আরও অধ্যায় তৈরি করবেন?'))return bCh(par);location.hash=='#/qbank/'+par?pBank(par):go('#/qbank/'+par)}
async function bRn(id,pg){const v=(prompt('নতুন নাম')||'').trim();if(!v)return;await api('bRen',{id,name:v});const x=BANK.find(y=>y.id==id);if(x)x.name=v;pBank(pg)}
async function bDS(id,pg){const all=await bSubs(),k=all.filter(x=>x.par==id).map(x=>x.id);if(!confirm(k.length?'এই বিষয়, এর সব অধ্যায় ও সব প্রশ্ন মুছবেন?':'এর সব প্রশ্নসহ মুছবেন?'))return;await bDelS([id,...k]);pBank(pg)}
async function bDQ(sid,id,k){if(!confirm('মুছবেন?'))return;await bDel(id,sid,k);pBank(sid)}
function bTxt(sid){sheet('📝 প্রশ্ন যোগ (Text)',`<p class="mu">এক বা একাধিক প্রশ্ন পেস্ট করুন; দুই প্রশ্নের মাঝে ফাঁকা লাইন।</p>${HLP}<textarea id="tq" rows="10" oninput="tqp()" placeholder="এখানে প্রশ্ন পেস্ট করুন" style="margin-top:8px"></textarea><p id="tqi" class="mu" style="margin:8px 0"></p><button class="bt" style="width:100%;text-align:center" onclick="bTxa('${sid}')">➕ Add to Bank</button>`)}
async function bTxa(sid){const g=parseQ($('#tq').value.trim()).filter(x=>!x.bad);if(!g.length)return toast('কোনো সঠিক প্রশ্ন পাওয়া যায়নি');const n=await bAdd(sid,g);cl();toast(n+' টি যোগ হয়েছে ✔');pBank(sid)}
function bOne(sid){sheet('➕ নতুন প্রশ্ন',`<textarea id="b1q" rows="3" placeholder="প্রশ্ন"></textarea>${[0,1,2,3,4].map(j=>`<input id="b1o${j}" placeholder="Option ${j+1}" style="margin-top:8px">`).join('')}<input id="b1a" placeholder="সঠিক উত্তরের নম্বর (যেমন 2 অথবা 1,3)" style="margin-top:8px"><textarea id="b1e" rows="2" placeholder="ব্যাখ্যা (ঐচ্ছিক)" style="margin:8px 0"></textarea><button class="bt" style="width:100%;text-align:center" onclick="bOne2('${sid}')">Save</button>`)}
async function bOne2(sid){const q=$('#b1q').value.trim(),o=[],map=[];[0,1,2,3,4].forEach(j=>{const v=$('#b1o'+j).value.trim();if(v){map[j]=o.length;o.push(v)}});
 const a=bn2en($('#b1a').value).split(/[,\s]+/).map(x=>map[+x-1]).filter(x=>x!==undefined);if(!q||o.length<2||!a.length)return toast('প্রশ্ন, ২+ অপশন ও সঠিক উত্তর দিন');
 await bAdd(sid,[{q,o,a,e:$('#b1e').value.trim()}]);cl();toast('Saved ✔');pBank(sid)}
function csvP(t){const r=[];let row=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';r.push(row);row=[]}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.some(y=>y.trim()))}
function bCsv(sid){const f=D.createElement('input');f.type='file';f.accept='.csv,.txt';f.onchange=()=>{const r=new FileReader();r.onload=async()=>{const rows=csvP(r.result.replace(/^\ufeff/,''));if(rows[0]&&/^(question|প্রশ্ন)/i.test(rows[0][0].trim()))rows.shift();
 const g=[];rows.forEach(x=>{const o=[],map=[];[1,2,3,4,5].forEach(j=>{const v=(x[j]||'').trim();if(v){map[j-1]=o.length;o.push(v)}});const a=bn2en(x[6]||'').split(/[,\s|]+/).map(y=>map[+y-1]).filter(y=>y!==undefined);
  if((x[0]||'').trim()&&o.length>1&&a.length)g.push({q:x[0].trim(),o,a,e:(x[7]||'').trim()})});
 if(!g.length)return toast('কোনো সঠিক প্রশ্ন পাওয়া যায়নি');const n=await bAdd(sid,g);toast(n+' টি যোগ ✔'+(rows.length>n?' ('+(rows.length-n)+' টি বাদ)':''));pBank(sid)};r.readAsText(f.files[0])};f.click()}
function bTest(sid){if(!DB.tests.length)return toast('কোনো টেস্ট নেই');sheet('কোন টেস্টে যোগ করবেন?',DB.tests.map(t=>[E(t.name)+` (${cnt(t)}/${LIM})`,()=>bPick(sid,t.id)]))}
async function bPick(sid,tid){const t=tst(tid);await ensureQs(t);const r=room(t);if(r<=0)return toast(`এই টেস্টে ইতিমধ্যে ${LIM} টি প্রশ্ন আছে`);
 sheet('📤 টেস্টে যোগ করুন',`<p>টেস্ট: <b>${E(t.name)}</b><br><span class="mu">আর ${r} টি যোগ করা যাবে</span></p>${secSel('bqs','x',t)}<label class="f">কতটি প্রশ্ন?</label><input id="bqn" type="number" min="1" max="${r}" value="${Math.min(20,r)}"><label class="f">কোনগুলো?</label><select id="bqm"><option value="r">র‍্যান্ডম</option><option value="f">ক্রমানুসারে (প্রথম থেকে)</option></select><div class="ac"><button class="bt" onclick="bGo('${sid}','${tid}')">Add</button></div>`)}
async function bGo(sid,tid){const t=tst(tid),sc=secVal('bqs');if(sc===null)return;let n=+$('#bqn').value||0;if(n<1)return toast('সংখ্যা দিন');n=Math.min(n,room(t));
 const all=await bSubs(),g=await bGet([sid,...all.filter(x=>x.par==sid).map(x=>x.id)],n,$('#bqm').value=='r');g.forEach(x=>t.qs.push({t:'mc',q:x.q,o:x.o,a:x.a,e:x.e,img:x.img,sid:sc}));norm(t);sv();cl();toast(g.length+' টি প্রশ্ন যোগ হয়েছে ✔');if(CT&&CT.id==tid&&location.hash.startsWith('#/t/'))go('#/t/'+tid+'/view');else pBank(sid)}
async function toBank(){let sb=[];try{sb=await bSubs()}catch(e){return toast('Question Bank পাওয়া যাচ্ছে না')}
 sheet('কোন বিষয়ে সংরক্ষণ করবেন?',[...sb.map(b=>[E(b.lb)+` (${b.n})`,()=>bSave(b.id)]),['➕ নতুন বিষয়',async()=>{const n=(prompt('বিষয়ের নাম')||'').trim();if(n)bSave(await bNew(n))}]])}
async function bSave(sid){const g=CT.qs.filter(x=>x.t=='mc');if(!g.length)return toast('কোনো MCQ নেই');const n=await bAdd(sid,g);toast(n+' টি প্রশ্ন ব্যাংকে সংরক্ষিত ✔')}

route();
</script>
</body>
</html>
